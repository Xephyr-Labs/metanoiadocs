{{/*
Everything the pod reads that is not fit to be an argument: the database URL,
the SMTP password, the unattended admin's password.

Skipped entirely when the operator points `externalDatabase.existingSecret` at
a secret of their own — a chart that copies your credentials into a second
object it manages is a chart that leaks them into `helm get values`.
*/}}
{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metanoiadocs.fullname" . }}
  labels:
    {{- include "metanoiadocs.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "metanoiadocs.databaseUrl" . | quote }}
  {{- if and .Values.mail.password (not .Values.mail.existingSecret) }}
  SMTP_PASS: {{ .Values.mail.password | quote }}
  {{- end }}
  {{- if .Values.admin.password }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  {{- end }}
{{- end }}

{{- if and .Values.postgres.enabled (not .Values.externalDatabase.url) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metanoiadocs.fullname" . }}-db
  labels:
    {{- include "metanoiadocs.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "metanoiadocs.pgPassword" . | quote }}
{{- end }}
