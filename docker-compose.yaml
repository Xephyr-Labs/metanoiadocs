name: metanoiadocs

# Production stack. One image serves the React UI, the REST API, and the /sync
# WebSocket:  docker compose up -d --build  →  http://localhost:8092
# (Front it with a TLS reverse proxy and set BASE_URL=https://your.domain.)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metanoia
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metanoiadocs
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metanoia -d metanoiadocs"]
      interval: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      BASE_URL: ${BASE_URL:-http://localhost:8092}
      DATABASE_URL: postgresql://metanoia:${DB_PASSWORD}@db:5432/metanoiadocs
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-*}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MetanoiaDocs <no-reply@example.com>}
    ports:
      - "8092:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  db_data:
