<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Metanoia</title>
<style>
/* Hallmark · component: server picker (first launch) · genre: modern-minimal · theme: project tokens (MetanoiaDocs)
 * states: default · focus · active · disabled · loading · error · success
 * contrast: pass (ink/canvas 11.7:1 light, 13.9:1 dark; white on accent-strong 5.0:1)
 */
@font-face {
  font-family: 'Onest Variable';
  src: url('fonts/onest-latin-wght-normal.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --canvas: #ffffff;
  --surface: #f7f7f5;
  --ink: #37352f;
  --muted: #6f6e6a;
  --faint: #86857f;
  --line: #e9e9e7;
  --line-strong: #dcdbd8;
  --accent: #2383e2;
  --accent-strong: #1a6fc4;
  --accent-soft: #e7f1fb;
  --danger: #be322c;
  --danger-soft: #fbeceb;
  --font: 'Onest Variable', ui-sans-serif, system-ui, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #191919;
    --surface: #232323;
    --ink: #e9e9e7;
    --muted: #a5a5a3;
    --faint: #8a8a87;
    --line: #333331;
    --line-strong: #424240;
    --accent: #4a9eea;
    --accent-strong: #2276cf;
    --accent-soft: #1d3a57;
    --danger: #f07b75;
    --danger-soft: #4a2523;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow-x: clip; overscroll-behavior: none; }
body {
  background: var(--canvas);
  color: var(--ink);
  font: 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
main {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + var(--space-12)) var(--space-6) calc(env(safe-area-inset-bottom) + var(--space-6));
  max-width: 440px;
  margin: 0 auto;
}
.brand { display: flex; align-items: center; gap: var(--space-3); font-weight: 600; font-size: 17px; }
.brand svg { width: 36px; height: 36px; flex: none; }
h1 {
  margin: var(--space-12) 0 var(--space-2);
  font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;
  font-style: normal; overflow-wrap: anywhere;
}
.lede { margin: 0 0 var(--space-8); color: var(--muted); }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: var(--space-2); }
.field {
  display: flex; align-items: center;
  height: 52px; border-radius: 12px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow 120ms var(--ease-out);
}
.field:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.field[data-state='error'] { box-shadow: inset 0 0 0 2px var(--danger); }
.field span { padding-left: var(--space-4); color: var(--faint); user-select: none; }
input {
  flex: 1; min-width: 0; height: 100%;
  border: 0; outline: 0; background: transparent;
  padding: 0 var(--space-4) 0 2px;
  color: var(--ink); font: inherit; font-size: 16px;
}
input::placeholder { color: var(--faint); }
.message { min-height: 24px; margin: var(--space-2) 0 0; font-size: 14px; color: var(--danger); }
button.primary {
  width: 100%; height: 52px; margin-top: var(--space-4);
  border: 0; border-radius: 12px;
  background: var(--accent-strong); color: #fff;
  font: inherit; font-weight: 600; font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out);
}
button.primary:active:not(:disabled) { transform: scale(0.98); }
button.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button.primary:disabled { opacity: 0.5; }
button.primary[data-state='loading'] { opacity: 0.85; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgb(255 255 255 / 0.35); border-top-color: #fff;
  animation: spin 700ms linear infinite; display: none;
}
[data-state='loading'] .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.recent { margin-top: var(--space-8); }
.recent h2 { margin: 0 0 var(--space-2); font-size: 13px; font-weight: 600; color: var(--muted); }
.recent ul { list-style: none; margin: 0; padding: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.recent li + li { border-top: 1px solid var(--line); }
.recent button {
  width: 100%; min-height: 52px; padding: 0 var(--space-4);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left;
}
.recent button:active { background: var(--surface); }
.recent button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.recent .host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent svg { flex: none; color: var(--faint); }
.foot { margin-top: auto; padding-top: var(--space-8); font-size: 13px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0ms !important; animation-duration: 1500ms !important; }
}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7.5" fill="#2383e2"/><path d="M22 6h4l0 4z" fill="#fff" fill-opacity=".28"/><path d="M8 23V12.4c0-.5.62-.74.95-.36L16 19.5l7.05-7.46c.33-.38.95-.14.95.36V23" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    MetanoiaDocs
  </div>

  <h1>Connect to your workspace</h1>
  <p class="lede">Enter the address your team opens MetanoiaDocs at. You'll sign in next.</p>

  <form id="form" novalidate>
    <label for="server">Server address</label>
    <div class="field" id="field">
      <span>https://</span>
      <input id="server" name="server" type="url" inputmode="url" enterkeyhint="go"
        autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="docs.yourcompany.com" aria-describedby="message" required />
    </div>
    <p class="message" id="message" role="alert"></p>
    <button class="primary" id="go" type="submit" disabled>
      <span class="spinner" aria-hidden="true"></span><span id="go-label">Continue</span>
    </button>
  </form>

  <section class="recent" id="recent" hidden>
    <h2>Recent</h2>
    <ul id="recent-list"></ul>
  </section>

  <p class="foot">Your server address is stored on this phone only.</p>
</main>

<script>
(() => {
  const Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
  const $ = (id) => document.getElementById(id);
  const input = $('server'), go = $('go'), label = $('go-label'), message = $('message'), field = $('field');
  const RECENT = 'recent-servers';

  // "docs.acme.com", "https://docs.acme.com/", "docs.acme.com/d/123" -> "https://docs.acme.com"
  function normalize(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (/^http:\/\//i.test(v)) return { error: 'Use the https:// address — the app only connects securely.' };
    if (!/^https:\/\//i.test(v)) v = 'https://' + v;
    try {
      const u = new URL(v);
      if (!u.hostname.includes('.') && u.hostname !== 'localhost') return { error: 'That doesn’t look like a full address, e.g. docs.yourcompany.com' };
      return { url: u.origin, host: u.host };
    } catch { return { error: 'That doesn’t look like a web address.' }; }
  }

  async function get(url) {
    const http = Plugins.CapacitorHttp;
    if (http) {
      const r = await http.get({ url, connectTimeout: 8000, readTimeout: 8000, headers: { accept: 'application/json' } });
      let data = r.data;
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch { /* not json */ } }
      return { status: r.status, data };
    }
    const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
    return { status: r.status, data: await r.json().catch(() => null) };
  }

  // A MetanoiaDocs server says so on /health; older ones are known by their manifest.
  async function isMetanoia(base) {
    const health = await get(base + '/health');
    if (health.status !== 200) return false;
    if (health.data && health.data.app === 'metanoiadocs') return true;
    const manifest = await get(base + '/manifest.webmanifest').catch(() => null);
    return !!(manifest && manifest.data && /metanoia/i.test(String(manifest.data.name || '')));
  }

  function setState(state, text) {
    go.dataset.state = state;
    field.dataset.state = state === 'error' ? 'error' : '';
    message.textContent = state === 'error' ? text : '';
    label.textContent = state === 'loading' ? 'Checking…' : state === 'success' ? 'Connecting…' : 'Continue';
    go.disabled = state === 'loading' || state === 'success' || !input.value.trim();
    input.readOnly = state === 'loading' || state === 'success';
  }

  async function recent() {
    try { return JSON.parse((await Plugins.Preferences.get({ key: RECENT })).value || '[]'); } catch { return []; }
  }

  async function connect(raw) {
    const n = normalize(raw);
    if (!n) return;
    if (n.error) return setState('error', n.error);
    setState('loading');
    let ok = false;
    try { ok = await isMetanoia(n.url); } catch {
      return setState('error', 'Couldn’t reach ' + n.host + '. Check the address and your connection.');
    }
    if (!ok) return setState('error', n.host + ' answered, but it isn’t a MetanoiaDocs server.');
    setState('success');
    const list = [n.url, ...(await recent()).filter((u) => u !== n.url)].slice(0, 3);
    await Plugins.Preferences?.set({ key: RECENT, value: JSON.stringify(list) }).catch(() => {});
    if (Plugins.Server) await Plugins.Server.set({ url: n.url });
    else location.href = n.url; // in a desktop browser, for trying the page out
  }

  input.addEventListener('input', () => { if (go.dataset.state === 'error') setState('idle'); go.disabled = !input.value.trim(); });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); input.blur(); connect(input.value); });

  recent().then((list) => {
    if (!list.length) return;
    const ul = $('recent-list');
    for (const url of list) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = '<span class="host"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
      b.querySelector('.host').textContent = url.replace(/^https:\/\//, '');
      b.addEventListener('click', () => { input.value = url.replace(/^https:\/\//, ''); connect(url); });
      li.appendChild(b); ul.appendChild(li);
    }
    $('recent').hidden = false;
  });

  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  Plugins.StatusBar?.setBackgroundColor({ color: dark ? '#191919' : '#ffffff' }).catch(() => {});
  Plugins.StatusBar?.setStyle({ style: dark ? 'DARK' : 'LIGHT' }).catch(() => {});
  setState('idle');
})();
</script>
</body>
</html>
